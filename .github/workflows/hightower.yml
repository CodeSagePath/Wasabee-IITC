name: Build and Deploy Hightower
on:
  push:
    branches:
      - hightower
    tags:
      - v0.1-hightower
jobs:
  build-and-deploy-hightower:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Build 🔧
        run: |
          npm install
          npm run build-hightower

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: dist
          folder: releases/hightower
          target-folder: hightower
          clean: false
